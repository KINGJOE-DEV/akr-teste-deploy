kind: pipeline
type: docker
name: deploy

steps:
  - name: Build e Push da Imagem Docker
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - docker login 192.168.0.11:5025 -u "administrador" -p "hazel@@1954"
      # 1. Faz o build já "carimbando" a imagem com o endereço do registry
      - docker build -t 192.168.0.11:5025/teste_deploy:latest .
      # 2. Envia a imagem para o registry local do Swarm
      - docker push 192.168.0.11:5025/teste_deploy:latest

  - name: Subir Serviço no Docker Swarm
    image: docker:latest
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      # 1. O stack deploy garante que o serviço e redes existam
      - docker stack deploy -c Docker-compose.yml app --with-registry-auth
      # Pausa para garantir que o Swarm processe a criação/atualização antes de forçar o update
      - sleep 10
      # 2. O service update FORÇA todas as instâncias a baixarem a imagem 'latest' novamente
      - docker service update --force --with-registry-auth --image 192.168.0.11:5025/teste_deploy:latest app_teste_deploy