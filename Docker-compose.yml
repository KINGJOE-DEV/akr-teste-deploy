version: "3.8"
services:
  deploy:
    image:100.96.0.4:5025/teste_deploy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    ports:
      - "80:80"
    networks:
      - agent_network
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.srv_alta_disponibilidade == true
        max_replicas_per_node: 1

networks:
  agent_network:
    external: true


